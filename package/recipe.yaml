context:
  version: ${{ env.get("PKG_VERSION") }}

package:
  name: acellera-pdb2pqr
  version: ${{ version }}

source:
  path: ..

build:
  noarch: python
  script: python -m pip install --no-deps -vv .
  python:
    entry_points:
      - pdb2pqr = pdb2pqr.main:main
      - pdb2pqr30 = pdb2pqr.main:main
      - dx2cube = pdb2pqr.main:dx_to_cube
      - inputgen = pdb2pqr.inputgen:main

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - numpy
    # The Acellera fork, matching the PyPI dependency. Depending on upstream
    # propka here would leave conda users without the fork's fixes, including the
    # Python 3.14 annotations fix, and would fail pip check since the wheel asks
    # for acellera-propka. Served from the acellera channel, which this recipe's
    # build already passes via -c acellera.
    - acellera-propka >=3.5.1.post1
    - requests
    - typing_extensions
    - mmcif_pdbx >=1.1.2

tests:
  - python:
      imports:
        - pdb2pqr

about:
  homepage: https://www.poissonboltzmann.org
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: >-
    Automates preparation of structures for continuum solvation calculations
    as well as other biomolecular structure modeling, analysis, and simulation.
  repository: https://github.com/Acellera/pdb2pqr

extra:
  recipe-maintainers:
    - stefdoerr
