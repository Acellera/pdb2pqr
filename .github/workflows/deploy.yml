name: Deploy acellera-pdb2pqr

# Publish to PyPI and the acellera conda channel on a release tag.
# Tags are created by `make release version=X.Y.Z[.postN]`, which bumps and
# pushes pdb2pqr/_version.py before tagging, so the tag always matches the
# version published from _version.py.
on:
  push:
    tags:
      - "v*"

jobs:
  deploy-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PUBLIC_PYPI_API_TOKEN }}
          skip-existing: true

  deploy-conda:
    runs-on: ubuntu-latest
    defaults: # Needed for conda
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: build
          python-version: "3.10"
          channels: acellera,conda-forge

      - name: Read version from _version.py
        run: |
          PKG_VERSION=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('pdb2pqr/_version.py').read_text()).group(1))")
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Build conda package
        run: |
          conda install -y anaconda-client rattler-build
          rattler-build build --recipe ./package/recipe.yaml --output-dir /tmp/pkg/ --no-include-recipe -c acellera -c conda-forge

      - name: Upload to conda
        run: |
          anaconda -t ${{ secrets.ANACONDA_TOKEN_BASIC }} upload -u acellera /tmp/pkg/*/acellera-pdb2pqr-*.conda
